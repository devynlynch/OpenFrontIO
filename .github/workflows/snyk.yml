# Snyk Open Source dependency scan (#1820).
# Skips on fork PRs: GitHub does not pass Actions secrets to workflows from
# forks, so SNYK_TOKEN would be empty and the job would fail auth. Fork PRs
# are covered by the Snyk GitHub App (PR checks) once the repo is imported,
# plus Socket which already runs.
name: 🔐 Snyk

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  snyk:
    name: 🔐 Snyk Open Source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same-repo PRs and pushes only — forks never receive SNYK_TOKEN.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
